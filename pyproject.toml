# Two uses of this file:
#  * `pip install -e .` installs the light `cmf` benchmark tool (setuptools, [project] below);
#    its dependencies are listed in cmf/requirements.txt.
#  * `poetry install` installs the full research environment (Hydra/Lightning/Ray/W&B) from
#    [tool.poetry] and poetry.lock. The [project] table only names the package and declares its
#    dependencies dynamic, so the lock file stays valid.

[project]
name = "controllable-memory-functions"
version = "0.2.0"
description = "Benchmark what kinds of memory a sequence model can learn, using controllable memory functions"
readme = "README.md"
license = "MIT"
authors = [{ name = "Haotian Jiang" }, { name = "Shida Wang" }, { name = "Zeyu Bao" }]
dynamic = ["dependencies", "optional-dependencies", "requires-python"]

[project.scripts]
cmf = "cmf.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["cmf/requirements.txt"] }
optional-dependencies.ray = { file = ["cmf/requirements-ray.txt"] }
optional-dependencies.test = { file = ["cmf/requirements-test.txt"] }

[tool.setuptools.packages.find]
include = ["cmf*", "src*"]

[tool.setuptools.package-data]
cmf = ["suites/*.yaml", "reference/*/*/*.csv", "reference/*/*/*.json", "*.txt"]

[tool.poetry]
package-mode = false


[tool.poetry.dependencies]
python = ">=3.10,<3.12"
ray = {version = "2.40.0", extras = ["tune"]}
hydra-core = "1.3.2"
hydra-colorlog = "1.2.0"
hydra-optuna-sweeper = "1.2.0"
lightning = "2.5.0.post0"
torch = "2.5.1"
pykeops = "^2.2.3"
einops = "^0.8.0"
wandb = "^0.27.0"
tensorboard = "^2.18.0"
jupyter = "^1.1.1"
rootutils = "^1.0.7"
rich = "^13.9.4"
torchvision = "^0.20.1"
setuptools = "^75.6.0"
autoroot = "^1.0.1"
matplotlib = "^3.10.0"
scikit-learn = "^1.6.0"
seaborn = "^0.13.2"
x-transformers = "^2.2.1"
natsort = "^8.4.0"
torchtune = "^0.6.1"
torchao = "^0.10.0"
ipykernel = "^6.30.1"



[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
