[tool.poetry]
name = "controllable-memory-functions"
version = "0.1.0"
description = "A package for benchmarking sequential architectures on sythentic datasets"
authors = ["Haotian Jiang, Shida Wang, Zeyu Bao"]
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = ">=3.10,<3.12"
ray = {version = "2.40.0", extras = ["tune"]}
hydra-core = "1.3.2"
hydra-colorlog = "1.2.0"
hydra-optuna-sweeper = "1.2.0"
lightning = "2.5.0.post0"
torch = "2.5.1"
pykeops = "^2.2.3"
einops = "^0.8.0"
wandb = "^0.27.0"
tensorboard = "^2.18.0"
jupyter = "^1.1.1"
rootutils = "^1.0.7"
rich = "^13.9.4"
torchvision = "^0.20.1"
setuptools = "^75.6.0"
autoroot = "^1.0.1"
matplotlib = "^3.10.0"
scikit-learn = "^1.6.0"
seaborn = "^0.13.2"
x-transformers = "^2.2.1"
natsort = "^8.4.0"
torchtune = "^0.6.1"
torchao = "^0.10.0"
ipykernel = "^6.30.1"



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
