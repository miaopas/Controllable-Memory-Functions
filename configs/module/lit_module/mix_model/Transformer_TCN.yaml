defaults:
  - layers@layers.Transformer: Transformer_torch
  - layers@layers.TCN: TCN
  - layers@layers.Output: Linear

  - model: Sequential
  - lit_module: base
  - _self_

layers:
  Transformer:
    input_dim: 1
    output_dim: 16
    num_layers: 2
    hid_dim: 16
    nhead: 4
    src_length: 1024
    dim_feedforward: 64
  TCN:
    input_size: 16
    n_layers: 10
    channel: 16
    kernel_size: 2
    dropout: 0.1
  Output:
    input_size: 16
    output_size: 1

model:
  layers:
    - ${module.layers.Transformer}
    - ${module.layers.TCN}
    - ${module.layers.Output}
