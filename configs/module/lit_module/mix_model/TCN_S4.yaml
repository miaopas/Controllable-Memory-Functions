defaults:
  - layers@layers.Input: Linear
  - layers@layers.TCN: TCN
  - layers@layers.S4: S4
  - layers@layers.Output: Linear

  - model: Sequential
  - lit_module: base
  - _self_

layers:
  Input:
    input_size: 1
    output_size: 64
  TCN:
    input_size: 64
    n_layers: 10
    channel: 16
    kernel_size: 2
    dropout: 0.1
  S4:
    d_model: 16
    n_layers: 1
    transposed: False
  Output:
    input_size: 16
    output_size: 1

model:
  layers:
    - ${module.layers.Input}
    - ${module.layers.TCN}
    - ${module.layers.S4}
    - ${module.layers.Output}
