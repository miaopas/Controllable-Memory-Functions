defaults:
  - layers@layers.Transformer: Transformer_torch
  - layers@layers.S4: S4
  - layers@layers.Output: Linear

  - model: Sequential
  - lit_module: base
  - _self_

layers:
  Transformer:
    input_dim: 1
    output_dim: 16
    num_layers: 2
    hid_dim: 16
    nhead: 4
    src_length: 1024
    dim_feedforward: 64
  S4:
    d_model: 16
    n_layers: 1
    transposed: False
  Output:
    input_size: 16
    output_size: 1

model:
  layers:
    - ${module.layers.Transformer}
    - ${module.layers.S4}
    - ${module.layers.Output}
