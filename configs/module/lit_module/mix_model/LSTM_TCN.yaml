defaults:
  - layers@layers.Input: Linear
  - layers@layers.LSTM: LSTM
  - layers@layers.TCN: TCN
  - layers@layers.Output: Linear

  - model: Sequential
  - lit_module: base
  - _self_

layers:
  Input:
    input_size: 1
    output_size: 16
  LSTM:
    input_size: 16
    hidden_size: 16
    num_layers: 1
  TCN:
    input_size: 16
    n_layers: 10
    channel: 16
  Output:
    input_size: 16
    output_size: 1

model:
  layers:
    - ${module.layers.Input}
    - ${module.layers.LSTM}
    - ${module.layers.TCN}
    - ${module.layers.Output}
