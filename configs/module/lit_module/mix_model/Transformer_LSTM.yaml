defaults:
  - layers@layers.Transformer: Transformer_torch
  - layers@layers.LSTM: LSTM
  - layers@layers.Output: Linear

  - model: Sequential
  - lit_module: base
  - _self_

layers:
  Transformer:
    input_dim: 1
    output_dim: 16
    num_layers: 2
    hid_dim: 16
    nhead: 4
    src_length: 1024
    dim_feedforward: 64
  LSTM:
    input_size: 16
    hidden_size: 16
    num_layers: 1
  Output:
    input_size: 16
    output_size: 1

model:
  layers:
    - ${module.layers.Transformer}
    - ${module.layers.LSTM}
    - ${module.layers.Output}
