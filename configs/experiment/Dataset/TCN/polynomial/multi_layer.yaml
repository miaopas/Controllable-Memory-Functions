# @package _global_

defaults:
  - /experiment/Dataset/TCN/base.yaml



data:
  T: 1024
  D: 1
  rho_name: polynomial
  inner_activation: tanh
  output_activation: tanh
run_specs:
  task_name: "Multilayer_TCN_poly"
  tags: ["TCN", "poly", "multilayer"]


sweeper:
  param:
    data.rho_param.alpha: [0.05      , 0.07777778, 0.10555556, 0.13333333, 0.16111111, 0.18888889, 0.21666667, 0.24444444, 0.27222222, 0.3       ]
    module.layers.Layer2.channel: [32]
    module.layers.Layer2.n_layers: [2,4,6,8,10]
    run_specs.seed: [11, 22,33,44,55]
  resources:
    cpu: 2
    gpu: 0.33

logger:
  wandb:
    project: "Multilayer_TCN_poly"
