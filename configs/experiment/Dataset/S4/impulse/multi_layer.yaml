# @package _global_

defaults:
  - /experiment/Dataset/S4/base.yaml


data:
  T: 1024
  D: 1
  rho_name: impulse
  inner_activation: tanh
  output_activation: tanh
run_specs:
  task_name: "Multilayer_S4_impulse"
  tags: ["S4", "impulse", "multilayer"]


sweeper:
  param:
    data.rho_param.alpha: np.linspace(0.01, 1,8).tolist()
    module.layers.Layer2.d_model: [32]
    module.layers.Layer2.n_layers: [2,3,4,5,6]
    run_specs.seed: [11,22,33,44,55]
  resources:
    cpu: 6
    gpu: 0.49

logger:
  wandb:
    project: "Multilayer_S4_impulse"
