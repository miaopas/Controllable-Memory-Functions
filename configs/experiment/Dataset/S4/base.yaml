# @package _global_
defaults:
  - override /data: lf
  - override /trainer: gpu.yaml
  - override /module: lit_module/S4

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

paths:
  run_dir: "# Decided by individual runs"

trainer:
  min_epochs: 10
  max_epochs: 300
  # gradient_clip_val: 0.5


module:
  layers:
    Layer1:
      input_size: 1
      output_size: ${..Layer2.d_model}
    Layer2:
      d_model: 64
      n_layers: 1
    Layer3:
      input_size: ${..Layer2.d_model}
      output_size: 1

callbacks:
  model_checkpoint:
    monitor: "val/loss"
    mode: "min"
    save_top_k: 1

  early_stopping:
    monitor: "train/loss_epoch"
    mode: "min"


logger:
  wandb:
    name: "S4-m${module.layers.Layer2.d_model}_${round:${data.rho_param.alpha}}_${random_id:4}"
    tags: ${run_specs.tags}
    group: "lf"
