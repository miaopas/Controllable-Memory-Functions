# @package _global_
defaults:
  - override /data: lf
  - override /trainer: gpu.yaml
  - override /module: lit_module/LSTM

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

paths:
  run_dir: "# Decided by individual runs"

trainer:
  min_epochs: 10
  max_epochs: 300
  # gradient_clip_val: 0.5

module:
  layers:
    LSTM:
      input_size: ${..LSTM.hidden_size}
      hidden_size: ${..LSTM.hidden_size}
      num_layers: 1
    Input:
      input_size: 1
      output_size: ${..LSTM.hidden_size}
    Output:
      input_size: ${..LSTM.hidden_size}
      output_size: 1

callbacks:
  model_checkpoint:
    monitor: "val/loss"
    mode: "min"
    save_top_k: 1

  early_stopping:
    monitor: "train/loss_epoch"
    mode: "min"
