# @package _global_
defaults:
  - override /data: lf
  - override /trainer: gpu.yaml

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

trainer:
  min_epochs: 1
  max_epochs: 1000
  # gradient_clip_val: 0.5

logger:
  wandb:
    name: "${run_specs.task_name}_${random_id:4}"
    tags: ${run_specs.tags}
    group: "lf"
    project: "Deep_Linear"

callbacks:
  model_checkpoint:
    monitor: "val/loss"
    mode: "min"
    save_top_k: 5

  early_stopping:
    monitor: "val/loss"
    mode: "min"
