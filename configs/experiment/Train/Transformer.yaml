# @package _global_

defaults:
  - /experiment/Train/base.yaml
  - override /module: lit_module/Transformer_torch
  - override /module/lit_module/optimizer: Adam
  - override /module/lit_module/scheduler: ReduceLROnPlateau
  - override /callbacks: 
    - default
    - check_unused_parameters

data:
  T: 128
  D: 1
  rho_name: impulse
  rho_param:
    alpha: 1
  batch_size: 128 # Needs to be divisible by the number of devices (e.g., if in a distributed setup)
  train_val_test_split: [263840, 2048, 2048]

module:
  layers:
    Layer1:
      input_dim: 1
      output_dim: 1
      num_layers: 4
      hid_dim: 64
      nhead: 1
      src_length: 128
      dim_feedforward: 1024

  lit_module:
      optimizer:
        lr: 0.0001


run_specs:
  task_name: "Testing"
  tags: ["Testing_transformer"]



logger:
  wandb:
    name: "Testing_${random_id:4}"
    tags: ${run_specs.tags}
    group: "lf"
    project: "Teting"