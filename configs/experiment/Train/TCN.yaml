# @package _global_

defaults:
  - /experiment/Train/base.yaml
  - override /module: lit_module/TCN
  - override /module/lit_module/optimizer: Adam
  - override /module/lit_module/scheduler: ReduceLROnPlateau
  - override /callbacks: 
    - default
    - check_unused_parameters

data:
  T: 1024
  D: 1
  rho_name: exponential
  rho_param:
    alpha: 1

module:
  layers:
    Layer1:
      input_size: 1
      output_size: ${..Layer2.channel}
    Layer2:
      input_size: ${..Layer2.channel}
      n_layers: 10
      channel: 60
    Layer3:
      input_size: ${..Layer2.channel}
      output_size: 1



run_specs:
  task_name: "Testing"
  tags: ["Testing"]



logger:
  wandb:
    name: "Testing_${random_id:4}"
    tags: ${run_specs.tags}
    group: "lf"
    project: "Teting"