# @package _global_

defaults:
  - /experiment/Train/base.yaml
  - override /module: lit_module/LSTM
  - override /module/lit_module/optimizer: Adam
  - override /module/lit_module/scheduler: ReduceLROnPlateau
  - override /callbacks: 
    - default
    - check_unused_parameters

data:
  T: 1024
  D: 1
  rho_name: exponential
  rho_param:
    alpha: 1

module:
  layers:
    LSTM:
      input_size: ${..LSTM.hidden_size}
      hidden_size: 64
      num_layers: 1
    Input:
      input_size: 1
      output_size: ${..LSTM.hidden_size}
    Output:
      input_size: ${..LSTM.hidden_size}
      output_size: 1

run_specs:
  task_name: "Testing"
  tags: ["Testing"]



logger:
  wandb:
    name: "Testing_${random_id:4}"
    tags: ${run_specs.tags}
    group: "lf"
    project: "Teting"