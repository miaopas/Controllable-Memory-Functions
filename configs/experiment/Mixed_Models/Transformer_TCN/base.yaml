# @package _global_
defaults:
  - override /data: lf
  - override /trainer: gpu.yaml
  - override /module: lit_module/mix_model/Transformer_TCN

paths:
  run_dir: "# Decided by individual runs"

trainer:
  min_epochs: 10
  max_epochs: 300

module:
  model_size: 16
  layers:
    Transformer:
      input_dim: 1
      output_dim: ${...model_size}
      hid_dim: ${...model_size}
      nhead: 4
      num_layers: 2
      src_length: 256
      dim_feedforward: 64
    TCN:
      input_size: ${...model_size}
      n_layers: 10
      channel: ${...model_size}
    Output:
      input_size: ${...model_size}
      output_size: 1

callbacks:
  model_checkpoint:
    monitor: "val/loss"
    mode: "min"
    save_top_k: 1
  early_stopping:
    monitor: "train/loss_epoch"
    mode: "min"

logger:
  wandb:
    name: "Transformer_TCN-m${module.model_size}_${round:${data.rho_param.alpha}}_${random_id:4}"
    tags: ${run_specs.tags}
    group: "lf"
