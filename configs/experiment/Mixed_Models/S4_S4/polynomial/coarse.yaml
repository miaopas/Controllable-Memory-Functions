# @package _global_

defaults:
  - /experiment/Mixed_Models/S4_S4/base.yaml

data:
  T: 1024
  D: 1
  rho_name: polynomial
  inner_activation: tanh
  output_activation: tanh

run_specs:
  task_name: "Mixed_S4_S4_poly_experiment"
  tags: ["Mixed_S4_S4", "poly", "experiment"]

# 10*5*4 = 200 runs
sweeper:
  param:
    data.rho_param.alpha: [0.05, 0.07777778, 0.10555556, 0.13333333, 0.16111111, 0.18888889, 0.21666667, 0.24444444, 0.27222222, 0.3]
    module.model_size: [8, 16, 32, 64, 128]
    run_specs.seed: [11, 22, 33, 44]
  resources:
    cpu: 4
    gpu: 0.33

logger:
  wandb:
    project: "Mixed_S4_S4_poly_experiment"
