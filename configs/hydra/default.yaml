# https://hydra.cc/docs/configure_hydra/intro/

# enable color logging
defaults:
  - override hydra_logging: colorlog
  - override job_logging: colorlog

# output directory, generated dynamically on each run, even for multiple runs, we should save it in this folder indicating the starting time.
run:
  dir: ${paths.log_dir}/${to_path:${run_specs.task_name}}/${now:%Y-%m-%d}_${now:%H-%M-%S}
# sweep:
#   dir: ${paths.log_dir}/${run_specs.task_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
#   subdir: ${hydra.job.num}

job_logging:
  handlers:
    rich_log:
      class: src.utils.pylogger.CustomRichHandler
      markup: True
      rich_tracebacks: True
      tracebacks_show_locals: False
      omit_repeated_times: False
    file:
      filename: ${hydra.runtime.output_dir}/${run_specs.task_name}.log
  root:
    handlers: [rich_log, file]
  # disable_existing_loggers: True
